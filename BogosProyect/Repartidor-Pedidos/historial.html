<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Historial - Bogos Reparto</title>
    <link rel="icon" href="../CSS-IMAGENES/imagenes/logo.jpg" type="image/jpeg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../CSS-IMAGENES/styles.css">
    <script src="../seguridad.js"></script>
    
    <style>
        body { background-color: #f4f6f9; padding-bottom: 80px; }
        .bottom-nav { border-top-left-radius: 20px; border-top-right-radius: 20px; box-shadow: 0 -4px 10px rgba(0,0,0,0.05); }
        .nav-item-mobile { flex: 1; text-align: center; color: #adb5bd; transition: 0.3s; }
        .nav-item-mobile.active { color: #d11f26; }
        .card-historial { border-radius: 15px; }
    </style>
</head>
<body>

    <!-- Header Superior -->
    <nav class="navbar navbar-dark sticky-top shadow-sm" style="background-color: #0b1a45;">
        <div class="container-fluid px-3 py-1">
            <span class="navbar-brand mb-0 h1 fw-bold d-flex align-items-center">
                <i class="fa-solid fa-clipboard-list me-2"></i> Mi Jornada
            </span>
            <button class="btn btn-outline-light border-0" id="btnCerrarSesion" title="Cerrar Sesión">
                <i class="fa-solid fa-right-from-bracket fs-5"></i>
            </button>
        </div>
    </nav>

    <!-- Contenedor Principal -->
    <div class="container mt-4">
        
        <!-- Tarjeta Resumen Financiero del Repartidor -->
        <div class="card bg-success text-white shadow-sm rounded-4 mb-4 border-0">
            <div class="card-body p-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <p class="mb-0 small fw-semibold opacity-75">EFECTIVO A ENTREGAR</p>
                        <h2 class="fw-bold mb-0" id="lblTotalEfectivo">$0.00</h2>
                    </div>
                    <div class="bg-white text-success rounded-circle d-flex justify-content-center align-items-center shadow-sm" style="width: 50px; height: 50px;">
                        <i class="fa-solid fa-money-bill-wave fs-4"></i>
                    </div>
                </div>
                <hr class="opacity-25 my-2">
                <div class="d-flex justify-content-between small">
                    <span><i class="fa-solid fa-credit-card me-1"></i> Tarjeta/Transf: <b id="lblTotalDigital">$0.00</b></span>
                    <span id="lblTotalEntregas">0 Entregas</span>
                </div>
            </div>
        </div>

        <h6 class="fw-bold text-secondary mb-3">Últimos Pedidos Procesados</h6>

        <!-- Área donde JS inyectará el historial -->
        <div id="contenedorHistorial">
            <div class="text-center mt-5">
                <div class="spinner-border text-success" role="status"></div>
                <p class="text-muted mt-2 fw-semibold">Cargando tu historial...</p>
            </div>
        </div>
    </div>

    <!-- Barra de Navegación Inferior -->
    <nav class="navbar fixed-bottom bg-white bottom-nav pb-2 pt-3">
        <div class="container-fluid d-flex justify-content-around align-items-center">
            <a href="index.html" class="nav-item-mobile text-decoration-none">
                <i class="fa-solid fa-map-location-dot fs-4 d-block mb-1"></i>
                <span class="small fw-bold d-block" style="font-size: 0.75rem;">En Ruta</span>
            </a>
            <a href="historial.html" class="nav-item-mobile active text-decoration-none">
                <i class="fa-solid fa-clipboard-check fs-4 d-block mb-1"></i>
                <span class="small fw-bold d-block" style="font-size: 0.75rem;">Historial</span>
            </a>
        </div>
    </nav>

    <script src="historial.js"></script>
</body>
</html>
